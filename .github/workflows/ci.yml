name: "shipquick_latest CI"
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check file sizes (changed files only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            # Moved files are not new content, so skip renames.
            FILES=$(git diff --name-status -M "origin/${{ github.base_ref }}...HEAD" | awk -F'\t' '$1 !~ /^R/ {print $2}')
          elif git rev-parse --verify -q HEAD~1 >/dev/null; then
            # Push event: same rule, skip renames.
            FILES=$(git diff --name-status -M HEAD~1 HEAD | awk -F'\t' '$1 !~ /^R/ {print $2}')
          else
            FILES=$(find . -path ./.git -prune -o -type f -print)
          fi
          LARGE=""
          while IFS= read -r f; do
            if [ -f "$f" ] && [ "$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")" -gt 512000 ]; then
              LARGE="$LARGE $f"
            fi
          done <<< "$FILES"
          if [ -n "$LARGE" ]; then
            echo "Changed files over 500KB:$LARGE"
            exit 1
          fi
          echo "File sizes OK"
      - name: Check for merge conflicts
        run: |
          if grep -r "<<<<<<<\|=======\|>>>>>>>" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.md" . | grep -v ".git/"; then
            echo "Merge conflict markers found"
            exit 1
          fi
      - name: Check markdown code blocks
        run: |
          python3 -c "
          import glob, sys
          bad = []
          for f in glob.glob('**/*.md', recursive=True):
              if '.git/' in f:
                  continue
              ticks = open(f).read().count('\`\`\`')
              if ticks % 2 != 0:
                  bad.append(f)
          if bad:
              print('Unclosed code blocks in:', bad)
              sys.exit(1)
          print('Markdown blocks OK')
          "
  commit-msg:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE"
          BAD=$(git log "origin/$BASE..HEAD" --pretty=%s | grep -v "^Merge " | grep -vE "^(feat|fix|docs|design|test|chore|refactor|style|perf|ci|build)(\(.+\))?: .+" || true)
          if [ -n "$BAD" ]; then
            echo "Non-conventional commits found:"
            echo "$BAD"
            exit 1
          fi
          echo "Commit messages OK"
  pr-size:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size
        run: |
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE"
          # Moved files are not new review surface, so renames do not count.
          COUNT=$(git diff --name-status -M "origin/$BASE...HEAD" | awk -F'\t' '$1 !~ /^R/' | wc -l | tr -d ' ')
          RENAMES=$(git diff --name-status -M "origin/$BASE...HEAD" | awk -F'\t' '$1 ~ /^R/' | wc -l | tr -d ' ')
          echo "Counted files: $COUNT (ignoring $RENAMES renames)"
          if [ "$COUNT" -gt 50 ]; then
            echo "PR too large ($COUNT files, max 50, excluding renames). Split it."
            exit 1
          fi
  team-block:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the teammate block in the PR body
        run: |
          printf '%s\n' "$PR_BODY" | awk '/^## For the reviewer/{f=1;next} /^## /{f=0} f' | python3 scripts/check_block.py
  test:
    runs-on: ubuntu-latest
    needs: [pre-commit]
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.4.x"
      - name: Install dependencies
        run: |
          pip install pytest
      - name: Run tests
        run: |
          mkdir -p logs
          pytest --tb=short
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: logs/
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [pre-commit, commit-msg, pr-size, team-block, test]
    if: always()
    steps:
      - name: Check all job results
        run: |
          echo "pre-commit: ${{ needs.pre-commit.result }}"
          echo "commit-msg: ${{ needs.commit-msg.result }}"
          echo "pr-size: ${{ needs.pr-size.result }}"
          echo "team-block: ${{ needs.team-block.result }}"
          echo "test: ${{ needs.test.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
