name: "shipquick_latest CI"
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.4.x"
      - name: Install dependencies
        run: |
          pip install pytest
      - name: Run tests
        run: |
          pytest --tb=short
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: logs/