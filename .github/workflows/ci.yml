name: "shipquick_latest CI"
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  pre-commit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check file sizes (changed files only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || find . -path ./.git -prune -o -type f -print)
          fi
          LARGE=""
          for f in $FILES; do
            if [ -f "$f" ] && [ "$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")" -gt 512000 ]; then
              LARGE="$LARGE $f"
            fi
          done
          if [ -n "$LARGE" ]; then
            echo "Changed files over 500KB:$LARGE"
            exit 1
          fi
          echo "File sizes OK"
      - name: Check for merge conflicts
        run: |
          if grep -r "<<<<<<<\|=======\|>>>>>>>" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.md" . | grep -v ".git/"; then
            echo "Merge conflict markers found"
            exit 1
          fi
      - name: Check markdown code blocks
        run: |
          python3 -c "
          import glob, sys
          bad = []
          for f in glob.glob('**/*.md', recursive=True):
              if '.git/' in f:
                  continue
              ticks = open(f).read().count('\`\`\`')
              if ticks % 2 != 0:
                  bad.append(f)
          if bad:
              print('Unclosed code blocks in:', bad)
              sys.exit(1)
          print('Markdown blocks OK')
          "
  commit-msg:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE"
          BAD=$(git log "origin/$BASE..HEAD" --pretty=%s | grep -v "^Merge " | grep -vE "^(feat|fix|docs|test|chore|refactor|style|perf|ci|build)(\(.+\))?: .+" || true)
          if [ -n "$BAD" ]; then
            echo "Non-conventional commits found:"
            echo "$BAD"
            exit 1
          fi
          echo "Commit messages OK"
  pr-size:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size
        run: |
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE"
          COUNT=$(git diff --name-only "origin/$BASE...HEAD" | wc -l | tr -d ' ')
          echo "Changed files: $COUNT"
          if [ "$COUNT" -gt 50 ]; then
            echo "PR too large ($COUNT files, max 50). Split it."
            exit 1
          fi
  test:
    runs-on: macos-latest
    needs: [pre-commit]
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.4.x"
      - name: Install dependencies
        run: |
          pip install pytest
      - name: Run tests
        run: |
          mkdir -p logs
          pytest --tb=short
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: logs/
