name: "shipquick_latest CI"
on:
  push:
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened, edited]   # story #92: an edited body re-runs team-block, tdd and uat
  workflow_dispatch:
    inputs:
      record:
        description: "Story #219: record new iOS reference images and upload them as the artifact ios-snapshots (ui/ios/SNAPSHOTS.md)"
        type: boolean
        default: false
# Story #484: one run per PR. A new run of the same PR (a push, an edited body) cancels the old one, so a replaced run
# never keeps a macOS job in the queue. A push run and a manual run have no PR number: their group is their own run id,
# so nothing ever cancels them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read   # story #140: the roles job reads commit authors via `gh api .../pulls/.../commits`
  issues: read          # story #155: the team-block job reads each linked story's body
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check file sizes (changed files only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            # Moved files are not new content, so skip renames.
            FILES=$(git diff --name-status -M "origin/${{ github.base_ref }}...HEAD" | awk -F'\t' '$1 !~ /^R/ {print $2}')
          elif git rev-parse --verify -q HEAD~1 >/dev/null; then
            # Push event: same rule, skip renames.
            FILES=$(git diff --name-status -M HEAD~1 HEAD | awk -F'\t' '$1 !~ /^R/ {print $2}')
          else
            FILES=$(find . -path ./.git -prune -o -type f -print)
          fi
          LARGE=""
          while IFS= read -r f; do
            if [ -f "$f" ] && [ "$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")" -gt 512000 ]; then
              LARGE="$LARGE $f"
            fi
          done <<< "$FILES"
          if [ -n "$LARGE" ]; then
            echo "Changed files over 500KB:$LARGE"
            exit 1
          fi
          echo "File sizes OK"
      - name: Check for merge conflicts
        run: |
          # A marker starts a line. The old pattern also hit text that only names the markers (scripts/check_local.sh, tests).
          if grep -rnE '^(<<<<<<< |=======$|>>>>>>> )' --include="*.py" --include="*.ts" --include="*.tsx" --include="*.md" . | grep -v ".git/"; then
            echo "Merge conflict markers found"
            exit 1
          fi
      - name: Check markdown code blocks
        run: |
          python3 -c "
          import glob, sys
          bad = []
          for f in glob.glob('**/*.md', recursive=True):
              if '.git/' in f:
                  continue
              ticks = open(f).read().count('\`\`\`')
              if ticks % 2 != 0:
                  bad.append(f)
          if bad:
              print('Unclosed code blocks in:', bad)
              sys.exit(1)
          print('Markdown blocks OK')
          "
  commit-msg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE"
          BAD=$(git log "origin/$BASE..HEAD" --pretty=%s | grep -v "^Merge " | grep -vE "^(feat|fix|docs|design|test|chore|refactor|style|perf|ci|build|release)(\(.+\))?: .+" || true)
          if [ -n "$BAD" ]; then
            echo "Non-conventional commits found:"
            echo "$BAD"
            exit 1
          fi
          echo "Commit messages OK"
  rule-copies:
    # Story #316 (A3): the kit's rule phrases are present and no drift in the kit CLAUDE.md phrases (rule 29).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the load-bearing rule phrases are in the kit CLAUDE.md (story #316)
        run: python3 scripts/check_rule_copies.py
  pr-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check PR size
        run: |
          if [ "${{ github.base_ref }}" = main ]; then
            case "${{ github.head_ref }}" in
              release/*) echo "skip pr-size: a release branch into main aggregates already-reviewed dev commits, not new review surface"; exit 0 ;;
            esac
          fi
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE"
          # Moved files are not new review surface, so renames do not count.
          # Story #219: recorded reference images in the protected folder ui/ios/ShipQuickUITests/__Snapshots__/ are looked at, not read, so they do not count either. Anchored: a __Snapshots__/ folder anywhere else still counts.
          COUNT=$(git diff --name-status -M "origin/$BASE...HEAD" | awk -F'\t' '$1 !~ /^R/ && $2 !~ /^ui\/ios\/ShipQuickUITests\/__Snapshots__\/.*\.png$/' | wc -l | tr -d ' ')
          RENAMES=$(git diff --name-status -M "origin/$BASE...HEAD" | awk -F'\t' '$1 ~ /^R/' | wc -l | tr -d ' ')
          IMAGES=$(git diff --name-status -M "origin/$BASE...HEAD" | awk -F'\t' '$1 !~ /^R/ && $2 ~ /^ui\/ios\/ShipQuickUITests\/__Snapshots__\/.*\.png$/' | wc -l | tr -d ' ')
          echo "Counted files: $COUNT (ignoring $RENAMES renames and $IMAGES ui/ios/ShipQuickUITests/__Snapshots__/*.png reference images)"
          if [ "$COUNT" -gt 50 ]; then
            echo "PR too large ($COUNT files, max 50, excluding renames). Split it."
            exit 1
          fi
  frontend-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the design board is named for any frontend change (story #121)
        run: |
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE"
          printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
          bash scripts/check_frontend_design.sh --body-file /tmp/pr-body.md --base "origin/$BASE" --repo . --head "${{ github.head_ref }}"
  disable-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for a disable comment or ignore-file entry on an added line (story #131)
        run: |
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE"
          printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
          python3 scripts/check_disable_comments.py --base "origin/$BASE" --body-file /tmp/pr-body.md
  design-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No colour or font literal on an added web style line (story #133)
        run: |
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE"
          python3 scripts/check_design_literals.py --base "origin/$BASE"
      - name: stylelint on changed CSS, needless disables reported (story #133; run_stylelint_changed.sh: per package root, the project's own stylelint, pinned npx as the fallback)
        run: |
          BASE="${{ github.base_ref }}"
          bash scripts/run_stylelint_changed.sh "origin/$BASE"
  shortcut-ledger:
    continue-on-error: true   # warn only: a crash here must not block a merge (review_merge.sh refuses any non-SUCCESS check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shortcut ledger, warn only (story #327): never fails the build, not in the gate
        run: python3 scripts/check_shortcuts.py
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: A PR that changes code names the test it saw fail, and that test is in the diff (story #319)
        run: |
          case "$PR_AUTHOR" in
            dependabot\[bot\]|app/dependabot) echo "Dependabot: tdd exempt"; exit 0 ;;
          esac
          git fetch origin "$BASE_REF"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 scripts/check_tdd.py --body-file "$RUNNER_TEMP/pr-body.md" --base "origin/$BASE_REF" --base-branch "$BASE_REF" --head-branch "$HEAD_REF"
  roles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the PR author and every commit author is a coder account (story #140, the #114 case)
        run: |
          commit_authors=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --paginate --jq '.[] | "\(.author.login):\(.parents | length):\([.commit.message | capture("(?m)^Built-by:\\s*(?<s>\\S+)"; "g").s][-1] // "")"' | paste -sd, -)
          coders=$(python3 scripts/roles.py get coder)
          reviewers=$(python3 scripts/roles.py get reviewer)
          owner=$(python3 scripts/roles.py get owner)
          coder_sessions=$(python3 scripts/roles.py get coder_sessions)
          python3 scripts/check_roles.py --author "$PR_AUTHOR" --commit-authors "$commit_authors" --coders "$coders" --reviewers "$reviewers" --owner "$owner" --coder-sessions "$coder_sessions"
  team-block:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the teammate block in the PR body
        run: |
          case "$PR_AUTHOR" in
            dependabot\[bot\]|app/dependabot) echo "Dependabot: team-block exempt"; exit 0 ;;
          esac
          printf '%s\n' "$PR_BODY" | awk '/^## For the reviewer/{f=1;next} /^## /{f=0} f' | python3 scripts/check_block.py
      - name: Check the PR body links its issue (Closes #n)
        run: |
          printf '%s\n' "$PR_BODY" | python3 scripts/check_closes.py --title "$PR_TITLE" --author "$PR_AUTHOR"
      - name: Check every linked user story names who does it (story #155)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
          python3 scripts/check_story.py --pr-body-file /tmp/pr-body.md
  uat-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the UAT-on-dev checklist is followable (story #120, #122)
        run: |
          bash scripts/has_dev_link.sh CLAUDE.md || { echo "no Dev link configured in this repo: UAT checklist exempt"; exit 0; }
          printf '%s\n' "$PR_BODY" | awk '/^## UAT on dev/{f=1;next} /^## /{f=0} f' | python3 scripts/check_uat.py
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the merge-commit tree's own .shipquick/freeze (story #126)
        run: |
          # actions/checkout on a pull_request event checks out the tentative merge of this PR into
          # main, so a PR that only removes .shipquick/freeze already shows it gone here -- no
          # separate exemption needed in CI (review_merge.sh, run outside Actions, needs one instead).
          [ -f .shipquick/freeze ] || { echo "not frozen"; exit 0; }
          python3 scripts/check_freeze.py < .shipquick/freeze
  ui-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every component doc matches its contract (story #182)
        run: python3 scripts/check_ui_docs.py --root ui/components
  ui-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every custom component has the owner's recorded yes (story #186)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_component_request.py --repo "$GITHUB_REPOSITORY"
  ui-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native topics are current with the component docs (story #183)
        run: python3 scripts/ui_topics.py --check
      - name: ui/llms.txt is current with the component docs and the registry (story #190)
        run: python3 scripts/ui_mcp.py llms --check
      - name: The compile proofs are current with the contracts (story #217)
        run: python3 scripts/ui_proof.py --check
      - name: The Swift contract structs are current with the contracts (story #222)
        run: python3 scripts/emit_contracts.py --check
      - name: The theme files are current with design/tokens.json (story #184)
        run: python3 scripts/emit_tokens.py --check
      - name: Set up Node (the pinned Astryx CLI needs 22.13 or newer)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the pinned CLI, no install scripts (ADR-012)
        timeout-minutes: 5
        working-directory: ui/tool
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Every counted component has a doc, a contract and a topic, and no name shadows core (story #216)
        timeout-minutes: 2
        run: python3 scripts/check_ui_coverage.py --require-web --strict-api
      - name: The CLI serves the kit's integration as shipped
        shell: bash   # pipefail: a failing ui.sh piped to grep must fail the step
        run: |
          bash scripts/ui.sh doctor integration validate shipquick-ui
          bash scripts/ui.sh docs android-button --dense | grep -q "androidx.compose.material3.Button"
          bash scripts/ui.sh docs ios-button --json | grep -q '"type": "docs.detail"'
  ui-changes:
    # Story #217: the two compile jobs below run only when ui/** changes. A skipped job is not a failure,
    # so the gate still passes on a PR that does not touch ui/.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did ui/** change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q origin "$BASE" || { echo ui=true >> "$GITHUB_OUTPUT"; exit 0; }
            range="origin/$BASE...HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            echo "ui=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0   # first push of a branch: compile to be safe
          fi
          # Captured first: a failing git diff inside the `if` below would have written ui=false. --no-renames lists the old path of a move.
          names=$(git diff --name-only --no-renames "$range") || { echo ui=true >> "$GITHUB_OUTPUT"; exit 0; }
          # Story #484: this file is not in either rule. A PR that only edits ci.yml waited 40 minutes for a macOS machine it did
          # not need. Known gap: an edit to the steps of a ui-* job no longer runs that job, on the PR or on the push to dev. The
          # reviewer asks for one manual run (workflow_dispatch), reads it on its own run page, and a PR-event run must be the last
          # run before approval: a manual run skips the PR-only jobs and would show a green gate (docs/PR_RULES.md section 14).
          if grep -qE '^(ui/|tests/fixtures/|scripts/ui_proof\.py|scripts/emit_contracts\.py|scripts/emit_tokens\.py|design/)' <<< "$names"; then echo "ui=true"; else echo "ui=false"; fi >> "$GITHUB_OUTPUT"
          # Story #219 (#375 review): the macOS snapshot job waits on `ios`, not on `ui`, so an Android-only or fixture-only PR never runs it.
          if grep -qE '^(ui/ios/|design/|scripts/emit_tokens\.py)' <<< "$names"; then echo "ios=true"; else echo "ios=false"; fi >> "$GITHUB_OUTPUT"
  ui-android-compile:
    # Story #217: compile every template and the generated proof/ApiProof.kt against Compose Material 3 1.4.0.
    # Compile only; nothing runs. All downloads happen on this runner (owner, #217).
    needs: [ui-changes]
    if: needs.ui-changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch Gradle, check it against distributionSha256Sum, and put it on PATH
        # The version and the sum both come from ui/android/gradle/wrapper/gradle-wrapper.properties. sha256sum -c fails
        # the job when the zip is not the one the sum names; nothing downloads Gradle behind this check.
        run: |
          props=ui/android/gradle/wrapper/gradle-wrapper.properties
          sum=$(sed -n 's/^distributionSha256Sum=//p' "$props")
          ver=$(sed -n 's#.*gradle-\([0-9.]*\)-bin\.zip#\1#p' "$props")
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$ver-bin.zip"
          echo "$sum  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$ver/bin" >> "$GITHUB_PATH"
      - name: Compile the templates and the proof
        working-directory: ui/android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle --no-daemon --stacktrace compileDebugKotlin
  ui-ios-compile:
    # Story #217: compile every template and the generated proof/ApiProof.swift for iOS. Compile only.
    needs: [ui-changes]
    if: needs.ui-changes.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Compile the templates and the proof for iOS
        working-directory: ui/ios
        run: xcodebuild -scheme ShipQuickUI -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Compile the fixture app (story #221) on the kit module, so its good and bad screens are real SwiftUI
        working-directory: tests/fixtures/ios/FixtureApp
        run: xcodebuild -scheme FixtureApp -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
  ui-android-lint:
    # Story #185: detekt (ForbiddenImport) and Konsist refuse hand-drawn UI. The good fixture screen must pass and the
    # bad one must fail with every rule named. detekt 1.23.8, Konsist 0.17.3, Gradle from the pin in ui/android. CI only.
    # Gradle checks every downloaded jar and pom against tests/fixtures/android/gradle/verification-metadata.xml; a missing or wrong sum fails the build.
    needs: [ui-changes]
    if: needs.ui-changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FIX: tests/fixtures/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch Gradle, check it against distributionSha256Sum, and put it on PATH
        run: |
          props=ui/android/gradle/wrapper/gradle-wrapper.properties
          sum=$(sed -n 's/^distributionSha256Sum=//p' "$props")
          ver=$(sed -n 's#.*gradle-\([0-9.]*\)-bin\.zip#\1#p' "$props")
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$ver-bin.zip"
          echo "$sum  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$ver/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: The good screen passes detekt and Konsist (CI tier)
        run: gradle --no-daemon --stacktrace -p "$FIX" detekt test -Ptier=ci -PuiDir=src/good
      - name: The bad screen fails detekt, and the report names every forbidden import
        run: |
          if gradle --no-daemon -p "$FIX" detekt -Ptier=ci -PuiDir=src/bad > "$RUNNER_TEMP/detekt-bad.txt" 2>&1; then
            cat "$RUNNER_TEMP/detekt-bad.txt"; echo "::error::the bad screen passed detekt"; exit 1
          fi
          cat "$RUNNER_TEMP/detekt-bad.txt"
          missing=0
          grep -q ForbiddenImport "$RUNNER_TEMP/detekt-bad.txt" || { echo "::error::rule ForbiddenImport is not named"; missing=1; }
          for imp in $(sed -nE "s/^      - '(.*)'$/\1/p" ui/android/lint/detekt.yml) androidx.compose.material.Button com.google.android.material.button.MaterialButton android.widget.Button com.example.fancyui.FancyChip; do
            grep -qF "$imp" "$RUNNER_TEMP/detekt-bad.txt" || { echo "::error::import not reported: $imp"; missing=1; }
          done
          grep -qF 'The import `androidx.compose.ui.draw` has been forbidden' "$RUNNER_TEMP/detekt-bad.txt" || { echo "::error::the wildcard import androidx.compose.ui.draw.* is not reported"; missing=1; }
          exit $missing
      - name: The bad screen fails Konsist, one named test per rule
        run: |
          if gradle --no-daemon -p "$FIX" test -Ptier=ci -PuiDir=src/bad > "$RUNNER_TEMP/konsist-bad.txt" 2>&1; then
            cat "$RUNNER_TEMP/konsist-bad.txt"; echo "::error::the bad screen passed Konsist"; exit 1
          fi
          tail -60 "$RUNNER_TEMP/konsist-bad.txt"
          xml=$(tr -d '\n' < "$FIX"/build/test-results/test/TEST-UiRulesKonsistTest.xml)
          missing=0
          for rule in $(sed -nE 's/.*fun ([a-z_]+)\(\).*/\1/p' ui/android/lint/UiRulesKonsistTest.kt); do
            if grep -qE "testcase name=\"$rule\(\)\"[^>]*>[^<]*<failure" <<< "$xml"; then echo "failed as wanted: $rule"; else echo "::error::rule did not fail: $rule"; missing=1; fi
          done
          exit $missing
      - name: The local tier warns and does not fail
        run: |
          gradle --no-daemon -p "$FIX" detekt -PuiDir=src/bad | tee "$RUNNER_TEMP/detekt-local.txt"
          grep -q ForbiddenImport "$RUNNER_TEMP/detekt-local.txt"
  ui-ios-lint:
    # Story #185: SwiftLint custom_rules refuse hand-drawn UI. The good fixture screen must pass `--strict` and the bad one
    # must fail with every rule id named. SwiftLint 0.65.1 from its release page, checked against the pinned SHA-256. CI only.
    # Story #218: both tiers run through ui/tool/ios_lint.sh (CI=1 strict, else warn-only) with the committed baseline
    # ui/ios/lint/swiftlint-baseline.json, and SwiftFormat 0.64.6 (pinned the same way) checks the format in lint mode.
    needs: [ui-changes]
    if: needs.ui-changes.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch SwiftLint 0.65.1 and check it against the pinned SHA-256
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/swiftlint"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Fetch SwiftFormat 0.64.6 and check it against the pinned SHA-256
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftformat.zip" https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.6/swiftformat.zip
          echo "70e6b2057647fb1c54d620ebbb6649274de56534c57f91f67461a129ebaaba3e  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/swiftformat"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: The good screen and the Tokens file pass the CI tier (strict, with the baseline, formatted)
        run: CI=1 bash ui/tool/ios_lint.sh tests/fixtures/ios/Good/*.swift
      - name: The bad screen fails the CI tier, and the report names every rule
        run: |
          if CI=1 bash ui/tool/ios_lint.sh tests/fixtures/ios/Bad/BadScreen.swift > "$RUNNER_TEMP/bad.txt" 2>&1; then
            cat "$RUNNER_TEMP/bad.txt"; echo "::error::the bad screen passed the CI tier"; exit 1
          fi
          cat "$RUNNER_TEMP/bad.txt"
          missing=0
          for rule in $(sed -nE 's/^  ([a-z_]+):$/\1/p' ui/ios/lint/swiftlint.yml); do
            if grep -qF "($rule)" "$RUNNER_TEMP/bad.txt"; then echo "reported as wanted: $rule"; else echo "::error::rule not reported: $rule"; missing=1; fi
          done
          exit $missing
      - name: The local tier warns and does not fail
        run: |
          CI= bash ui/tool/ios_lint.sh tests/fixtures/ios/Bad/BadScreen.swift | tee "$RUNNER_TEMP/local.txt"
          grep -q "warning:" "$RUNNER_TEMP/local.txt"
      - name: With no Swift file changed, the runner exits 0 and runs nothing
        run: |
          LINT_BASE=HEAD CI=1 bash ui/tool/ios_lint.sh | tee "$RUNNER_TEMP/none.txt"
          grep -q "no Swift file changed" "$RUNNER_TEMP/none.txt"
      - name: The fixture app (story #221) has a good screen that passes and a bad screen caught with each rule named
        run: python3 ui/tool/ios_fixture_check.py
  ui-ios-snapshots:
    # Story #219: swift-snapshot-testing and Prefire compare every template with its reference images (light and dark,
    # smallest and largest Dynamic Type, iPhone SE and Pro Max) on one pinned simulator. Runs only when ui/ios/**, design/**,
    # or scripts/emit_tokens.py changes (ui-changes.outputs.ios), never for an Android-only PR or a ci.yml-only PR (story #484). SHIPQUICK_SNAPSHOTS adds the test
    # target and its two packages to Package.swift; a child never resolves them. A workflow_dispatch run with record=true
    # writes new references and uploads them as the artifact `ios-snapshots`; how to commit them: ui/ios/SNAPSHOTS.md.
    needs: [ui-changes]
    # ios is empty after a fail-safe exit above (only ui=true is written), so the job runs then too.
    if: needs.ui-changes.outputs.ios != 'false'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SHIPQUICK_SNAPSHOTS: "1"
      TEST_RUNNER_SNAPSHOT_TESTING_RECORD: ${{ inputs.record == true && 'all' || 'never' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin Xcode 16.4 and check the iOS 18.5 simulator is there
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun simctl list runtimes | grep -F "iOS 18.5"
      - name: Run the snapshot tests on iPhone 16, iOS 18.5
        working-directory: ui/ios
        run: |
          # SPM makes one scheme, the product's, and it runs the test target too (#375 review: xcodebuild -list -json is not
          # clean JSON once Prefire is resolved, so the scheme is named, never parsed from xcodebuild output)
          xcodebuild test -scheme ShipQuickUI -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -skipPackagePluginValidation -skipMacroValidation -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -quiet
      - name: Run the accessibility audit on iPhone 16, iOS 18.5 (story #220)
        if: ${{ !cancelled() }}
        run: |
          # performAccessibilityAudit() needs an app and a UI test target, so XcodeGen 2.45.4 (pinned SHA-256) makes the
          # project from ui/ios/A11yAudit/project.yml. It runs after a red snapshot step too, so one red never hides the other.
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          xcodegen generate --spec ui/ios/A11yAudit/project.yml
          # without SHIPQUICK_SNAPSHOTS the local ShipQuickUI package resolves with no test packages
          # on a red run, print each failing test and the audit issue it names (the full log is too long to read)
          env -u SHIPQUICK_SNAPSHOTS xcodebuild test -project ui/ios/A11yAudit/A11yAudit.xcodeproj -scheme A11yHost \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/a11y.xcresult" > "$RUNNER_TEMP/a11y.log" 2>&1 || {
            grep -E -A40 "error:" "$RUNNER_TEMP/a11y.log" | grep -vE "^Test Case .* started" | head -250
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/a11y.xcresult"
            exit 1
          }
      - name: Upload the recorded reference images (record=true only)
        if: always() && inputs.record == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-snapshots
          path: ui/ios/ShipQuickUITests/__Snapshots__/
          if-no-files-found: error
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (SHA-256 checked)
        timeout-minutes: 5
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan for secrets (a PR reads its own commits, a push reads the whole history)
        env:
          BASE: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # A child with a long or forked history must not go red on an old commit it cannot rewrite.
            ./gitleaks git --no-banner --no-color --redact --verbose --log-opts="origin/$BASE..HEAD" .
          else
            ./gitleaks git --no-banner --no-color --redact --verbose .
          fi
  dependency-review:
    # Needs the repo's Dependency graph. The graph is probed first: without it the job warns and passes instead of failing,
    # so enabling the graph (Settings -> Advanced Security) switches the real check on.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe Dependency graph availability
        id: graph
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is not enabled on this repository (HTTP $code). Dependency review was skipped."
          fi
      - name: Dependency review
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No pull_request_target or workflow_run checks out the PR head, and every npm install skips scripts (story #325)
        run: python3 scripts/check_workflow_security.py
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre-commit]
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.4.x"
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          pip install pytest==9.0.2 pillow==12.3.0 pre-commit==4.7.0   # pillow: scripts/qa/ flow map and audit report (story #162); pre-commit: the real hooks in tests/test_adopt.py (story #479)
      - name: Run tests
        run: |
          mkdir -p logs
          pytest --tb=short
      - name: Set up Node (roadmap tests)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run roadmap tests
        run: node --test roadmap/*.test.js
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: logs/
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pre-commit, commit-msg, rule-copies, pr-size, frontend-design, disable-comments, design-tokens, roles, team-block, uat-checklist, freeze, ui-docs, ui-registry, ui-cli, ui-changes, ui-android-compile, ui-ios-compile, ui-android-lint, ui-ios-lint, ui-ios-snapshots, secret-scan, dependency-review, workflow-security, test, tdd]
    if: always()
    steps:
      - name: Check all job results
        run: |
          echo "pre-commit: ${{ needs.pre-commit.result }}"
          echo "commit-msg: ${{ needs.commit-msg.result }}"
          echo "rule-copies: ${{ needs.rule-copies.result }}"
          echo "pr-size: ${{ needs.pr-size.result }}"
          echo "frontend-design: ${{ needs.frontend-design.result }}"
          echo "disable-comments: ${{ needs.disable-comments.result }}"
          echo "design-tokens: ${{ needs.design-tokens.result }}"
          echo "roles: ${{ needs.roles.result }}"
          echo "team-block: ${{ needs.team-block.result }}"
          echo "uat-checklist: ${{ needs.uat-checklist.result }}"
          echo "freeze: ${{ needs.freeze.result }}"
          echo "ui-docs: ${{ needs.ui-docs.result }}"
          echo "ui-registry: ${{ needs.ui-registry.result }}"
          echo "ui-cli: ${{ needs.ui-cli.result }}"
          echo "ui-changes: ${{ needs.ui-changes.result }}"
          echo "ui-android-compile: ${{ needs.ui-android-compile.result }}"
          echo "ui-ios-compile: ${{ needs.ui-ios-compile.result }}"
          echo "ui-android-lint: ${{ needs.ui-android-lint.result }}"
          echo "ui-ios-lint: ${{ needs.ui-ios-lint.result }}"
          echo "ui-ios-snapshots: ${{ needs.ui-ios-snapshots.result }}"
          echo "secret-scan: ${{ needs.secret-scan.result }}"
          echo "dependency-review: ${{ needs.dependency-review.result }}"
          echo "workflow-security: ${{ needs.workflow-security.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "tdd: ${{ needs.tdd.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
