name: "vendor backup"
# Story #242 (docs/VENDOR_BACKUP.md). The only place the backup is fetched or pushed: GitHub CI, never the owner's Mac.
on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ui/tool/package-lock.json
      - ui/android/**/gradle-wrapper.properties
      - ui/android/**/build.gradle*
      - docs/research/android-m3-api.md
      - scripts/vendor_backup.py
      - scripts/vendor_pins.json
      - scripts/restore_vendor.sh
      - .github/workflows/vendor-backup.yml
permissions:
  contents: read
env:
  # The one place that names the backup. It is a separate private repo, so a clone of the kit never fetches it.
  BACKUP_REPO: satvik-jain-iitd/shipquick-vendor-backup
  BACKUP_REF: main
concurrency:
  group: vendor-backup
  cancel-in-progress: false
jobs:
  backup:
    # Step 1: fetch, check, and (on dev only) push to the backup repo. This kit repo is never written.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Open the backup repo (start an empty branch when it has none)
        # The backup repo is private: the read goes through VENDOR_BACKUP_TOKEN (contents: read is enough here). No push happens in this step.
        env:
          VENDOR_BACKUP_TOKEN: ${{ secrets.VENDOR_BACKUP_TOKEN }}
        run: |
          URL="https://github.com/${BACKUP_REPO}.git"
          AUTH="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$VENDOR_BACKUP_TOKEN" | base64 -w0)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -c "$AUTH" ls-remote --exit-code --heads "$URL" "$BACKUP_REF" >/dev/null; then
            git -c "$AUTH" clone --depth 1 --branch "$BACKUP_REF" "$URL" backup
          else
            git init -q -b "$BACKUP_REF" backup
            git -C backup remote add origin "$URL"
          fi
      - name: Fetch and check (lockfile integrity, POM checksums), write MANIFEST and licenses
        run: |
          python3 src/scripts/vendor_backup.py --build backup
          python3 src/scripts/vendor_backup.py --manifest-check backup
      - name: Commit and push to the backup repo
        # Only a push to dev, or the weekly run on main (the schedule's branch), writes the backup. A branch or manual run builds and checks it, and stops here.
        # VENDOR_BACKUP_TOKEN: a fine-grained token with write access to the backup repo only. Set on this step only.
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        env:
          VENDOR_BACKUP_TOKEN: ${{ secrets.VENDOR_BACKUP_TOKEN }}
        run: |
          cd backup
          printf '%s\n' "# shipquick-vendor-backup" "" "Offline copy of the pinned npm and Compose dependencies of the ShipQuick kit (story #242)." "Written only by the vendor-backup workflow of satvik-jain-iitd/shipquick_latest. Read docs/VENDOR_BACKUP.md there. Do not edit by hand." > README.md
          git add -A
          if git diff --cached --quiet; then echo "backup already up to date"; exit 0; fi
          git commit -q -m "chore(vendor): refresh backup from kit ${GITHUB_SHA::8}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$VENDOR_BACKUP_TOKEN" | base64 -w0)" push "https://github.com/${BACKUP_REPO}.git" "HEAD:${BACKUP_REF}"
          du -sh . --exclude=.git | tail -1
          python3 -c "import json; print(len(json.load(open('MANIFEST.json'))['artifacts']), 'artifacts')"
  restore:
    # Step 2: take only the backup repo and install from it with npm --offline and Gradle --offline.
    # It reads the repo and ref from the same env as the backup job, with the read token (the repo is private). No write access is used here.
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.BACKUP_REPO }}
          ref: ${{ env.BACKUP_REF }}
          token: ${{ secrets.VENDOR_BACKUP_TOKEN }}
          persist-credentials: false
          path: backup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Restore from the backup repo only (npm ci --offline, Gradle --offline)
        run: |
          node --version; npm --version; gradle --version | head -5
          bash src/scripts/restore_vendor.sh backup "$RUNNER_TEMP/restore"
