name: "shipquick_latest CD"
on:
  push:
    branches: [main]
    tags: ["D*", "v*"]
jobs:
  tag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify demo notes exist for tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            if [ ! -f "docs/demos/$TAG.md" ]; then
              echo "Missing docs/demos/$TAG.md for tag $TAG"
              echo "Every release tag needs a demo note. See pm/agile/RELEASE_GUIDE.md."
              exit 1
            fi
            echo "Demo notes found for $TAG"
          fi
      - name: Check changelog mentions the release
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            if ! grep -q "$TAG" CHANGELOG.md; then
              echo "CHANGELOG.md has no entry for $TAG"
              echo "Add a section for $TAG before releasing. See pm/agile/RELEASE_GUIDE.md."
              exit 1
            fi
            echo "Changelog entry found for $TAG"
          fi
  release:
    runs-on: ubuntu-latest
    needs: [tag-check]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Create release notes
        run: |
          TAG="${{ github.ref_name }}"
          echo "Release $TAG"
          ls "docs/demos/$TAG.md"
