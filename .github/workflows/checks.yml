# Every PR gate a ShipQuick child project needs (story #124), as one reusable workflow: team block,
# Closes link, design-first, UAT on main, environments — plus an adoption job that fails loudly when
# the caller's pin does not match the child's own knowledge/shipquick_latest submodule commit, or the
# child's .pre-commit-config.yaml carries no ShipQuick hooks. Adoption is never silent.
# A child never writes this file by hand: scripts/adopt.sh writes the caller (.github/workflows/shipquick-call.yml).
# The calling job must grant at least `contents: read`; a reusable workflow cannot take more than its caller gives.
name: ShipQuick checks (reusable)

on:
  workflow_call:
    inputs:
      shipquick_repo:
        description: Where the ShipQuick scripts live
        type: string
        default: satvik-jain-iitd/shipquick_latest
      shipquick_ref:
        description: Commit SHA (or tag) of the ShipQuick scripts. Use the same one as in `uses:`.
        type: string
        required: true
      kit_branch:
        description: >-
          Story #225, a rule-24 child: the branch that carries the knowledge/shipquick_latest submodule,
          .pre-commit-config.yaml and .shipquick/roles.yml, so `main` can carry only the caller. Empty
          (the default) means the branch the job runs on.
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read   # story #140: the roles job reads commit authors via `gh api .../pulls/.../commits`

jobs:
  adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
      - name: Check the caller's pin and the pre-commit hooks (story #124; kit branch, story #225)
        env:
          KIT_BRANCH: ${{ inputs.kit_branch }}
          TARGET: ${{ github.base_ref || github.ref_name }}
        run: |
          # The pin and the hooks are read from this commit, or from the kit branch when the job runs on another branch.
          ref=HEAD; at="at this commit"
          if [ -n "$KIT_BRANCH" ] && [ "$KIT_BRANCH" != "$TARGET" ]; then
            git -C project fetch -q --depth=1 origin "+refs/heads/$KIT_BRANCH:refs/remotes/origin/$KIT_BRANCH" || { echo "kit branch $KIT_BRANCH not found in this repo."; exit 1; }
            ref="origin/$KIT_BRANCH"; at="on kit branch $KIT_BRANCH"
          fi
          sub_sha="$(git -C project rev-parse -q --verify "$ref:knowledge/shipquick_latest" || true)"
          if [ -z "$sub_sha" ]; then
            echo "no knowledge/shipquick_latest submodule found $at. Run: bash knowledge/shipquick_latest/scripts/adopt.sh ."
            exit 1
          fi
          if [ "$sub_sha" != "${{ inputs.shipquick_ref }}" ]; then
            echo "the caller is pinned to ${{ inputs.shipquick_ref }}, but the submodule $at is at $sub_sha. Run: bash knowledge/shipquick_latest/scripts/adopt.sh ."
            exit 1
          fi
          if ! git -C project show "$ref:.pre-commit-config.yaml" 2>/dev/null | grep -q "check_local.sh"; then
            echo "no ShipQuick pre-commit hooks in .pre-commit-config.yaml $at. Run: bash knowledge/shipquick_latest/scripts/adopt.sh ."
            exit 1
          fi
          echo "adoption OK: pinned to $sub_sha $at, pre-commit hooks present"
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the pin is merged into dev/main or a release tag (story #131)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .shipquick/scripts/check_adoption_ancestor.py --repo "${{ inputs.shipquick_repo }}" --sha "${{ inputs.shipquick_ref }}"
      - name: Check every job has timeout-minutes (story #154)
        run: python3 .shipquick/scripts/check_timeouts.py project/.github/workflows
      - name: Check a configured docs/screens.txt is actually wired into CI (story #146)
        run: python3 .shipquick/scripts/check_screens_wired.py --screens-file project/docs/screens.txt --workflows-dir project/.github/workflows
  disable-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          fetch-depth: 0
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check for a disable comment or ignore-file entry on an added line (story #131)
        run: |
          BASE="${{ github.base_ref }}"
          git -C project fetch origin "$BASE"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 .shipquick/scripts/check_disable_comments.py --base "origin/$BASE" --repo project --body-file "$RUNNER_TEMP/pr-body.md"
  roles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the PR author and every commit author is a coder account (story #140, the #114 case)
        env:
          KIT_BRANCH: ${{ inputs.kit_branch }}
          TARGET: ${{ github.base_ref }}
        run: |
          commit_authors=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --paginate --jq '.[] | "\(.author.login):\(.parents | length):\([.commit.message | capture("(?m)^Built-by:\\s*(?<s>\\S+)"; "g").s][-1] // "")"' | paste -sd, -)
          roles_file=project/.shipquick/roles.yml
          # story #225: a rule-24 child keeps roles.yml on its kit branch; a PR into another branch reads it from there.
          if [ -n "$KIT_BRANCH" ] && [ "$KIT_BRANCH" != "$TARGET" ]; then
            git -C project fetch -q --depth=1 origin "+refs/heads/$KIT_BRANCH:refs/remotes/origin/$KIT_BRANCH" || { echo "kit branch $KIT_BRANCH not found in this repo (the caller's kit_branch)."; exit 1; }
            ref="origin/$KIT_BRANCH"
            git -C project show "$ref:.shipquick/roles.yml" > "$RUNNER_TEMP/roles.yml" 2>/dev/null || { echo "no .shipquick/roles.yml on kit branch $KIT_BRANCH. Add it there (bash knowledge/shipquick_latest/scripts/adopt.sh . --coder ... --reviewer ... --owner ...)."; exit 1; }
            roles_file="$RUNNER_TEMP/roles.yml"
          fi
          coders=$(python3 .shipquick/scripts/roles.py get coder --file "$roles_file")
          reviewers=$(python3 .shipquick/scripts/roles.py get reviewer --file "$roles_file")
          owner=$(python3 .shipquick/scripts/roles.py get owner --file "$roles_file")
          coder_sessions=$(python3 .shipquick/scripts/roles.py get coder_sessions --file "$roles_file")
          python3 .shipquick/scripts/check_roles.py --author "$PR_AUTHOR" --commit-authors "$commit_authors" --coders "$coders" --reviewers "$reviewers" --owner "$owner" --coder-sessions "$coder_sessions"
  team-block:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the teammate block in the PR body
        run: |
          case "$PR_AUTHOR" in
            dependabot\[bot\]|app/dependabot) echo "Dependabot: team-block exempt"; exit 0 ;;
          esac
          printf '%s\n' "$PR_BODY" | awk '/^## For the reviewer/{f=1;next} /^## /{f=0} f' | python3 .shipquick/scripts/check_block.py
      - name: Check the PR body links its issue (Closes #n)
        run: |
          printf '%s\n' "$PR_BODY" | python3 .shipquick/scripts/check_closes.py --title "$PR_TITLE" --author "$PR_AUTHOR"
  frontend-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          fetch-depth: 0
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the design board is named for any frontend change (story #121)
        run: |
          BASE="${{ github.base_ref }}"
          git -C project fetch origin "$BASE"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash .shipquick/scripts/check_frontend_design.sh --body-file "$RUNNER_TEMP/pr-body.md" --base "origin/$BASE" --repo project --head "${{ github.head_ref }}"
  uat-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the UAT-on-dev checklist is followable (story #120, #122)
        run: |
          bash .shipquick/scripts/has_dev_link.sh project/CLAUDE.md || { echo "no Dev link configured in this project: UAT checklist exempt"; exit 0; }
          printf '%s\n' "$PR_BODY" | awk '/^## UAT on dev/{f=1;next} /^## /{f=0} f' | python3 .shipquick/scripts/check_uat.py
  freeze-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the project's own .shipquick/freeze (story #126)
        run: |
          # The checkout above is the tentative merge of this PR into main, so a PR that only
          # removes project/.shipquick/freeze already shows it gone here.
          [ -f project/.shipquick/freeze ] || { echo "not frozen"; exit 0; }
          python3 .shipquick/scripts/check_freeze.py < project/.shipquick/freeze
  environments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check Dev link / Production link are filled past D0 (story #120)
        run: bash .shipquick/scripts/check_environments.sh --claude-md project/CLAUDE.md --milestone D1
  component-registry:
    # Story #186: every custom component in the child's ui/registry.json has the owner's recorded yes, read live from the issue.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Every custom component has the owner's recorded yes (story #186)
        run: cd project && python3 ../.shipquick/scripts/check_component_request.py --registry ui/registry.json --roles .shipquick/roles.yml
  rule-copies:
    # Story #316 (A3): the child's CLAUDE.md carries the kit rule block unchanged, and the kit's phrases are present.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - name: Check out the ShipQuick rules and scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: |
            scripts
            skills
            CLAUDE.md
          persist-credentials: false
      - name: The child's rule block matches the kit and the kit phrases are present (story #316)
        env:
          KIT_BRANCH: ${{ inputs.kit_branch }}
          TARGET: ${{ github.base_ref }}
        run: |
          child_file=project/CLAUDE.md
          # a rule-24 child keeps its rules on its kit branch; a PR into another branch reads them from there (as the roles job does).
          if [ -n "$KIT_BRANCH" ] && [ "$KIT_BRANCH" != "$TARGET" ]; then
            git -C project fetch -q --depth=1 origin "+refs/heads/$KIT_BRANCH:refs/remotes/origin/$KIT_BRANCH" || { echo "kit branch $KIT_BRANCH not found in this repo (the caller's kit_branch)."; exit 1; }
            ref="origin/$KIT_BRANCH"
            git -C project show "$ref:CLAUDE.md" > "$RUNNER_TEMP/CLAUDE.md" 2>/dev/null || { echo "no CLAUDE.md on kit branch $KIT_BRANCH. Run adopt.sh there to write it."; exit 1; }
            child_file="$RUNNER_TEMP/CLAUDE.md"
          fi
          python3 .shipquick/scripts/check_rule_copies.py --child "$child_file"
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [adoption, disable-comments, roles, team-block, frontend-design, uat-on-main, freeze-on-main, environments, component-registry, rule-copies]
    if: always()
    steps:
      - name: Check all job results (story #131 -- review_merge.sh requires this exact check to be SUCCESS)
        run: |
          echo "adoption: ${{ needs.adoption.result }}"
          echo "disable-comments: ${{ needs.disable-comments.result }}"
          echo "roles: ${{ needs.roles.result }}"
          echo "team-block: ${{ needs.team-block.result }}"
          echo "frontend-design: ${{ needs.frontend-design.result }}"
          echo "uat-on-main: ${{ needs.uat-on-main.result }}"
          echo "freeze-on-main: ${{ needs.freeze-on-main.result }}"
          echo "environments: ${{ needs.environments.result }}"
          echo "component-registry: ${{ needs.component-registry.result }}"
          echo "rule-copies: ${{ needs.rule-copies.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
