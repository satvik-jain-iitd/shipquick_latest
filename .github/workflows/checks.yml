# Every PR gate a ShipQuick child project needs (story #124), as one reusable workflow: team block,
# Closes link, design-first, UAT on main, environments — plus an adoption job that fails loudly when
# the caller's pin does not match the child's own knowledge/shipquick_latest submodule commit, or the
# child's .pre-commit-config.yaml carries no ShipQuick hooks. Adoption is never silent.
# A child never writes this file by hand: scripts/adopt.sh writes the caller (.github/workflows/shipquick-call.yml).
# The calling job must grant at least `contents: read`; a reusable workflow cannot take more than its caller gives.
name: ShipQuick checks (reusable)

on:
  workflow_call:
    inputs:
      shipquick_repo:
        description: Where the ShipQuick scripts live
        type: string
        default: satvik-jain-iitd/shipquick_latest
      shipquick_ref:
        description: Commit SHA (or tag) of the ShipQuick scripts. Use the same one as in `uses:`.
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read   # story #140: the roles job reads commit authors via `gh api .../pulls/.../commits`

jobs:
  adoption:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: project
      - name: Check the caller's pin and the pre-commit hooks (story #124)
        run: |
          sub_sha="$(git -C project rev-parse -q --verify "HEAD:knowledge/shipquick_latest" || true)"
          if [ -z "$sub_sha" ]; then
            echo "no knowledge/shipquick_latest submodule found at this commit. Run: bash knowledge/shipquick_latest/scripts/adopt.sh ."
            exit 1
          fi
          if [ "$sub_sha" != "${{ inputs.shipquick_ref }}" ]; then
            echo "the caller is pinned to ${{ inputs.shipquick_ref }}, but the submodule is at $sub_sha. Run: bash knowledge/shipquick_latest/scripts/adopt.sh ."
            exit 1
          fi
          if ! grep -q "check_local.sh" project/.pre-commit-config.yaml 2>/dev/null; then
            echo "no ShipQuick pre-commit hooks in .pre-commit-config.yaml. Run: bash knowledge/shipquick_latest/scripts/adopt.sh ."
            exit 1
          fi
          echo "adoption OK: pinned to $sub_sha, pre-commit hooks present"
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the pin is merged into dev/main or a release tag (story #131)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .shipquick/scripts/check_adoption_ancestor.py --repo "${{ inputs.shipquick_repo }}" --sha "${{ inputs.shipquick_ref }}"
  disable-comments:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: project
          fetch-depth: 0
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check for a disable comment or ignore-file entry on an added line (story #131)
        run: |
          BASE="${{ github.base_ref }}"
          git -C project fetch origin "$BASE"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 .shipquick/scripts/check_disable_comments.py --base "origin/$BASE" --repo project --body-file "$RUNNER_TEMP/pr-body.md"
  roles:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: project
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the PR author and every commit author is a coder account (story #140, the #114 case)
        run: |
          commit_authors=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --jq '[.[] | "\(.author.login):\(.parents | length)"] | join(",")')
          coders=$(python3 .shipquick/scripts/roles.py get coder --file project/.shipquick/roles.yml)
          reviewers=$(python3 .shipquick/scripts/roles.py get reviewer --file project/.shipquick/roles.yml)
          owner=$(python3 .shipquick/scripts/roles.py get owner --file project/.shipquick/roles.yml)
          python3 .shipquick/scripts/check_roles.py --author "$PR_AUTHOR" --commit-authors "$commit_authors" --coders "$coders" --reviewers "$reviewers" --owner "$owner"
  team-block:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the teammate block in the PR body
        run: |
          case "$PR_AUTHOR" in
            dependabot\[bot\]|app/dependabot) echo "Dependabot: team-block exempt"; exit 0 ;;
          esac
          printf '%s\n' "$PR_BODY" | awk '/^## For the reviewer/{f=1;next} /^## /{f=0} f' | python3 .shipquick/scripts/check_block.py
      - name: Check the PR body links its issue (Closes #n)
        run: |
          printf '%s\n' "$PR_BODY" | python3 .shipquick/scripts/check_closes.py --title "$PR_TITLE" --author "$PR_AUTHOR"
  frontend-design:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: project
          fetch-depth: 0
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the design board is named for any frontend change (story #121)
        run: |
          BASE="${{ github.base_ref }}"
          git -C project fetch origin "$BASE"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash .shipquick/scripts/check_frontend_design.sh --body-file "$RUNNER_TEMP/pr-body.md" --base "origin/$BASE" --repo project --head "${{ github.head_ref }}"
  uat-on-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: project
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the UAT-on-dev checklist is followable (story #120, #122)
        run: |
          bash .shipquick/scripts/has_dev_link.sh project/CLAUDE.md || { echo "no Dev link configured in this project: UAT checklist exempt"; exit 0; }
          printf '%s\n' "$PR_BODY" | awk '/^## UAT on dev/{f=1;next} /^## /{f=0} f' | python3 .shipquick/scripts/check_uat.py
  freeze-on-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Check out the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: project
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check the project's own .shipquick/freeze (story #126)
        run: |
          # The checkout above is the tentative merge of this PR into main, so a PR that only
          # removes project/.shipquick/freeze already shows it gone here.
          [ -f project/.shipquick/freeze ] || { echo "not frozen"; exit 0; }
          python3 .shipquick/scripts/check_freeze.py < project/.shipquick/freeze
  environments:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: project
      - name: Check out the ShipQuick scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.shipquick_repo }}
          ref: ${{ inputs.shipquick_ref }}
          path: .shipquick
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check Dev link / Production link are filled past D0 (story #120)
        run: bash .shipquick/scripts/check_environments.sh --claude-md project/CLAUDE.md --milestone D1
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [adoption, disable-comments, roles, team-block, frontend-design, uat-on-main, freeze-on-main, environments]
    if: always()
    steps:
      - name: Check all job results (story #131 -- review_merge.sh requires this exact check to be SUCCESS)
        run: |
          echo "adoption: ${{ needs.adoption.result }}"
          echo "disable-comments: ${{ needs.disable-comments.result }}"
          echo "roles: ${{ needs.roles.result }}"
          echo "team-block: ${{ needs.team-block.result }}"
          echo "frontend-design: ${{ needs.frontend-design.result }}"
          echo "uat-on-main: ${{ needs.uat-on-main.result }}"
          echo "freeze-on-main: ${{ needs.freeze-on-main.result }}"
          echo "environments: ${{ needs.environments.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
