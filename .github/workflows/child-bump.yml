name: "child bump (dry run)"
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to plan bumps for"
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Plan child bumps (dry run)
        env:
          GH_TOKEN: ${{ secrets.SHIPQUICK_CHILD_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.release_tag }}"; fi
          python3 scripts/child_bump.py --release-tag "$TAG" --json > /tmp/plan.json
          cat /tmp/plan.json
      - name: Upload plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: child-bump-plan
          path: /tmp/plan.json
