name: "shipquick nightly"
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.4.x"
      - name: Install deps
        run: |
          pip install pytest==9.0.2 pillow==12.3.0
          PINNED=$(cat scripts/graphify_version.txt)
          pip install "graphifyy==${PINNED}"
      - name: Run full Python suite
        run: pytest --tb=short
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run roadmap tests
        run: node --test roadmap/*.test.js
      - name: Graphify health
        env:
          GRAPHIFY_NO_AUTO_REFRESH: "1"
        run: |
          python3 scripts/graphify_kit.py build .
          python3 scripts/graphify_kit.py check .
      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-results
          path: |
            graphify-out/
