name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: input
    id: title
    attributes:
      label: Feature
      description: One sentence. What should exist?
    validations:
      required: true
  - type: input
    id: story
    attributes:
      label: User Story It Serves
      description: Which story or persona benefits?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Gherkin scenarios. When will it count as done?
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies
      description: Models, permissions, fixtures, owner input needed.
  - type: textarea
    id: ponytail
    attributes:
      label: Ponytail Check
      description: What is deliberately NOT being built?
    validations:
      required: true
