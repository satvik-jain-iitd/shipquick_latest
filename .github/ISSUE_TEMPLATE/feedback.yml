name: ShipQuick feedback
description: A ShipQuick gap found in another project, told as the whole story (story #118)
labels: ["feedback"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: One line naming the gap.
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: Situation
      description: Project, tool and version, what you were doing, the ids (PR, issue, run), the exact error text.
    validations:
      required: true
  - type: textarea
    id: expected-vs-seen
    attributes:
      label: Expected vs seen
      description: What you expected to happen; what actually happened; who or what noticed it.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: 3 to 5 numbered steps, and the one command that shows it.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How often it happens, time lost, what was blocked.
    validations:
      required: true
  - type: textarea
    id: root-cause
    attributes:
      label: Root cause
      description: 'A five-whys chain: at least three "Why" lines, ending at the real cause.'
      placeholder: |
        Why 1: ...
        Why 2: ...
        Why 3: ...
    validations:
      required: true
  - type: textarea
    id: why-shipquick-did-not-catch-it
    attributes:
      label: Why ShipQuick did not catch it
      description: The rule, check or script that was missing or wrong.
    validations:
      required: true
  - type: textarea
    id: industry-practice
    attributes:
      label: How big teams avoid it
      description: The industry practice, with a source, its tier (A, B, C, K, P) and a confidence from 0 to 1.
    validations:
      required: true
  - type: textarea
    id: generic-fix
    attributes:
      label: Generic fix for ShipQuick
      description: 'The change — written for any project, no project facts. State "Applies when" and "Does not apply to".'
    validations:
      required: true
  - type: textarea
    id: stop-the-repeat
    attributes:
      label: Stop the repeat
      description: The test or CI check that would fail if this happens again, and the workaround the project uses today.
    validations:
      required: true
