name: User Story
description: A testable story linked to an epic
labels: ["user-story"]
body:
  - type: input
    id: epic
    attributes:
      label: Epic
      description: Which epic does this belong to?
    validations:
      required: true
  - type: input
    id: persona
    attributes:
      label: Persona
      description: Who benefits? Name the persona and FR.
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Gherkin Scenarios
      description: Copy scenarios here and into matching test names.
    validations:
      required: true
  - type: dropdown
    id: frontend-change
    attributes:
      label: "Frontend change: yes / no"
      description: Does this touch the frontend — UI, layout, design or copy? A "yes" needs the next two fields filled before the story leaves Ready (story #121).
      options: ["no", "yes"]
    validations:
      required: true
  - type: input
    id: design-board
    attributes:
      label: Design board
      description: Required if Frontend change is yes. The board's name on the design canvas, moved to "Design final not live" by the owner's approval.
  - type: input
    id: approved
    attributes:
      label: Approved
      description: Required if Frontend change is yes. The date the owner approved that board.
  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      options:
        - label: GitHub issue linked to its epic, Gherkin copied in
        - label: Every scenario testable (unit, fixture, or matrix row)
        - label: Persona and FR named
        - label: Dependencies listed and available
        - label: Ponytail check written
        - label: Owner has seen the issue
        - label: "If Frontend change is yes: a sample screen was shown and approved on the design canvas before code started (story #121)"
